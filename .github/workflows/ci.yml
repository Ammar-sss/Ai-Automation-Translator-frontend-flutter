name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 🚀 Cancel in-progress runs on the same branch if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_check:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 1. Enforce strict code formatting on lib & test
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # 2. Static analysis
      - name: Analyze code
        run: flutter analyze

      # 3. Test execution
      - name: Run unit tests
        run: flutter test

  build_check:
    name: Build Android Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 4. Guarantee Android native builds without errors
      - name: Build Android APK
        run: flutter build apk --debug